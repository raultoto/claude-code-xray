<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="xray-loop: a pixel creature half way through an x-ray scan">
  <defs>
    <radialGradient id="film" cx="28%" cy="50%" r="85%">
      <stop offset="0" stop-color="#132a3a"/>
      <stop offset="0.55" stop-color="#0a1620"/>
      <stop offset="1" stop-color="#04080c"/>
    </radialGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fcff"/>
      <stop offset="1" stop-color="#a9e2fa"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe0ff" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#7fe0ff" stop-opacity="0.95"/>
      <stop offset="0.85" stop-color="#7fe0ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#7fe0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe0ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7fe0ff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#7fe0ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sticker" x="-20%" y="-20%" width="140%" height="150%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="14" result="grown"/>
      <feFlood flood-color="#ffffff"/>
      <feComposite in2="grown" operator="in" result="border"/>
      <feGaussianBlur in="grown" stdDeviation="9" result="blur"/>
      <feOffset in="blur" dy="10" result="drop"/>
      <feFlood flood-color="#000000" flood-opacity="0.55"/>
      <feComposite in2="drop" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="border"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.75  0 0 0 0 0.9  0 0 0 0 1  0 0 0 0.07 0"/>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#9fdcf6" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1280" height="560" fill="url(#film)"/>
  <rect width="1280" height="560" fill="url(#scan)"/>
  <rect width="1280" height="560" filter="url(#grain)"/>

