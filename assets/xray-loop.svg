<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="xray-loop: an x-ray of a spark, the agent loop seen from the inside">
  <defs>
    <radialGradient id="film" cx="30%" cy="50%" r="85%">
      <stop offset="0" stop-color="#132a3a"/>
      <stop offset="0.55" stop-color="#0a1620"/>
      <stop offset="1" stop-color="#04080c"/>
    </radialGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fcff"/>
      <stop offset="0.6" stop-color="#cdeffd"/>
      <stop offset="1" stop-color="#8fd3f2"/>
    </linearGradient>
    <radialGradient id="joint" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f4fcff" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#9fdcf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5fb7e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fe0ff" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#7fe0ff" stop-opacity="0.85"/>
      <stop offset="0.75" stop-color="#7fe0ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7fe0ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.75  0 0 0 0 0.9  0 0 0 0 1  0 0 0 0.07 0"/>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#9fdcf6" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1280" height="560" fill="url(#film)"/>
  <rect width="1280" height="560" fill="url(#scan)"/>
  <rect width="1280" height="560" filter="url(#grain)"/>

  <!-- the spark, as a radiograph: soft tissue, bone, marrow, and the joints near the center -->
  <g transform="translate(330 280)">
    <circle r="190" fill="#7fd0f2" opacity="0.05" filter="url(#soft)"/>
    <g opacity="0.3" filter="url(#soft)" fill="#8fd3f2">
      <g transform="rotate(0)"><rect x="-23" y="-164" width="46" height="140" rx="23"/></g>
      <g transform="rotate(29)"><rect x="-22" y="-132" width="44" height="108" rx="22"/></g>
      <g transform="rotate(58)"><rect x="-24" y="-174" width="48" height="150" rx="24"/></g>
      <g transform="rotate(91)"><rect x="-22" y="-142" width="44" height="118" rx="22"/></g>
      <g transform="rotate(122)"><rect x="-23" y="-166" width="46" height="142" rx="23"/></g>
      <g transform="rotate(151)"><rect x="-21" y="-126" width="42" height="102" rx="21"/></g>
      <g transform="rotate(181)"><rect x="-23" y="-160" width="46" height="136" rx="23"/></g>
      <g transform="rotate(212)"><rect x="-22" y="-138" width="44" height="114" rx="22"/></g>
      <g transform="rotate(240)"><rect x="-24" y="-178" width="48" height="154" rx="24"/></g>
      <g transform="rotate(271)"><rect x="-22" y="-134" width="44" height="110" rx="22"/></g>
      <g transform="rotate(301)"><rect x="-23" y="-164" width="46" height="140" rx="23"/></g>
      <g transform="rotate(331)"><rect x="-21" y="-124" width="42" height="100" rx="21"/></g>
    </g>
    <g filter="url(#glow)">
      <g transform="rotate(0)"><rect x="-9" y="-146" width="18" height="106" rx="9" fill="url(#bone)" opacity="0.88"/><ellipse cx="0" cy="-146" rx="14" ry="12" fill="url(#bone)" opacity="0.95"/><ellipse cx="0" cy="-44" rx="12" ry="10" fill="url(#bone)" opacity="0.7"/><line x1="0" y1="-134" x2="0" y2="-56" stroke="#3f8fb8" stroke-width="3" stroke-linecap="round" opacity="0.5"/></g>
      <g transform="rotate(29)"><rect x="-8" y="-114" width="16" height="74" rx="8" fill="url(#bone)" opacity="0.88"/><ellipse cx="0" cy="-114" rx="13" ry="11" fill="url(#bone)" opacity="0.95"/><ellipse cx="0" cy="-44" rx="11" ry="9" fill="url(#bone)" opacity="0.7"/><line x1="0" y1="-102" x2="0" y2="-56" stroke="#3f8fb8" stroke-width="2" stroke-linecap="round" opacity="0.5"/></g>
      <g transform="rotate(58)"><rect x="-10" y="-156" width="20" height="116" rx="10" fill="url(#bone)" opacity="0.88"/><ellipse cx="0" cy="-156" rx="15" ry="13" fill="url(#bone)" opacity="0.95"/><ellipse cx="0" cy="-44" rx="13" ry="11" fill="url(#bone)" opacity="0.7"/><line x1="0" y1="-144" x2="0" y2="-56" stroke="#3f8fb8" stroke-width="3" stroke-linecap="round" opacity="0.5"/></g>
      <g transform="rotate(91)"><rect x="-8" y="-124" width="16" height="84" rx="8" fill="url(#bone)" opacity="0.88"/><ellipse cx="0" cy="-124" rx="13" ry="11" fill="url(#bone)" opacity="0.95"/><ellipse cx="0" cy="-44" rx="11" ry="9" fill="url(#bone)" opacity="0.7"/><line x1="0" y1="-112" x2="0" y2="-56" stroke="#3f8fb8" stroke-width="2" stroke-linecap="round" opacity="0.5"/></g>
      <g transform="rotate(122)"><rect x="-9" y="-148" width="18" height="108" rx="9" fill="url(#bone)" opacity="0.88"/><ellipse cx="0" cy="-148" rx="14" ry="12" fill="url(#bone)" opacity="0.95"/><ellipse cx="0" cy="-44" rx="12" ry="10" fill="url(#bone)" opacity="0.7"/><line x1="0" y1="-136" x2="0" y2="-56" stroke="#3f8fb8" stroke-width="3" stroke-linecap="round" opacity="0.5"/></g>
      <g transform="rotate(151)"><rect x="-7" y="-108" width="14" height="68" rx="7" fill="url(#bone)" opacity="0.88"/><ellipse cx="0" cy="-108" rx="12" ry="10" fill="url(#bone)" opacity="0.95"/><ellipse cx="0" cy="-44" rx="10" ry="8" fill="url(#bone)" opacity="0.7"/><line x1="0" y1="-96" x2="0" y2="-56" stroke="#3f8fb8" stroke-width="2" stroke-linecap="round" opacity="0.5"/></g>
      <g transform="rotate(181)"><rect x="-9" y="-142" width="18" height="102" rx="9" fill="url(#bone)" opacity="0.88"/><ellipse cx="0" cy="-142" rx="14" ry="12" fill="url(#bone)" opacity="0.95"/><ellipse cx="0" cy="-44" rx="12" ry="10" fill="url(#bone)" opacity="0.7"/><line x1="0" y1="-130" x2="0" y2="-56" stroke="#3f8fb8" stroke-width="3" stroke-linecap="round" opacity="0.5"/></g>
      <g transform="rotate(212)"><rect x="-8" y="-120" width="16" height="80" rx="8" fill="url(#bone)" opacity="0.88"/><ellipse cx="0" cy="-120" rx="13" ry="11" fill="url(#bone)" opacity="0.95"/><ellipse cx="0" cy="-44" rx="11" ry="9" fill="url(#bone)" opacity="0.7"/><line x1="0" y1="-108" x2="0" y2="-56" stroke="#3f8fb8" stroke-width="2" stroke-linecap="round" opacity="0.5"/></g>
      <g transform="rotate(240)"><rect x="-10" y="-160" width="20" height="120" rx="10" fill="url(#bone)" opacity="0.88"/><ellipse cx="0" cy="-160" rx="15" ry="13" fill="url(#bone)" opacity="0.95"/><ellipse cx="0" cy="-44" rx="13" ry="11" fill="url(#bone)" opacity="0.7"/><line x1="0" y1="-148" x2="0" y2="-56" stroke="#3f8fb8" stroke-width="3" stroke-linecap="round" opacity="0.5"/></g>
      <g transform="rotate(271)"><rect x="-8" y="-116" width="16" height="76" rx="8" fill="url(#bone)" opacity="0.88"/><ellipse cx="0" cy="-116" rx="13" ry="11" fill="url(#bone)" opacity="0.95"/><ellipse cx="0" cy="-44" rx="11" ry="9" fill="url(#bone)" opacity="0.7"/><line x1="0" y1="-104" x2="0" y2="-56" stroke="#3f8fb8" stroke-width="2" stroke-linecap="round" opacity="0.5"/></g>
      <g transform="rotate(301)"><rect x="-9" y="-146" width="18" height="106" rx="9" fill="url(#bone)" opacity="0.88"/><ellipse cx="0" cy="-146" rx="14" ry="12" fill="url(#bone)" opacity="0.95"/><ellipse cx="0" cy="-44" rx="12" ry="10" fill="url(#bone)" opacity="0.7"/><line x1="0" y1="-134" x2="0" y2="-56" stroke="#3f8fb8" stroke-width="3" stroke-linecap="round" opacity="0.5"/></g>
      <g transform="rotate(331)"><rect x="-7" y="-106" width="14" height="66" rx="7" fill="url(#bone)" opacity="0.88"/><ellipse cx="0" cy="-106" rx="12" ry="10" fill="url(#bone)" opacity="0.95"/><ellipse cx="0" cy="-44" rx="10" ry="8" fill="url(#bone)" opacity="0.7"/><line x1="0" y1="-94" x2="0" y2="-56" stroke="#3f8fb8" stroke-width="2" stroke-linecap="round" opacity="0.5"/></g>
    </g>
    <circle r="38" fill="url(#joint)"/>
    <circle r="24" fill="none" stroke="#cdeffd" stroke-width="2" opacity="0.5"/>
    <circle r="9" fill="#f4fcff" opacity="0.85" filter="url(#glow)"/>
  </g>

  <!-- the scanner beam -->
  <rect x="60" y="331" width="560" height="2" fill="url(#beam)" filter="url(#glow)"/>
  <rect x="60" y="333" width="560" height="26" fill="#7fe0ff" opacity="0.04"/>

  <!-- film markers -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#9fdcf6">
    <rect x="40" y="36" width="44" height="44" rx="6" fill="none" stroke="#9fdcf6" stroke-width="2" opacity="0.7"/>
    <text x="62" y="68" font-size="28" font-weight="700" text-anchor="middle" opacity="0.8">R</text>
    <text x="40" y="524" font-size="14" letter-spacing="2" opacity="0.55">XR-0001 · AGENT LOOP · PA VIEW</text>
  </g>

  <!-- title -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="640" y="238" font-size="78" font-weight="700" fill="#e9f8ff" filter="url(#glow)">xray-loop</text>
    <text x="644" y="292" font-size="22" fill="#9fdcf6">see Claude Code from the inside, live</text>
    <g font-size="17" fill="#7fb6cf">
      <text x="644" y="352"><tspan fill="#58a6ff">●</tspan> the prompt it builds</text>
      <text x="644" y="382"><tspan fill="#58a6ff">●</tspan> the stream, chunk by chunk</text>
      <text x="644" y="412"><tspan fill="#f0883e">●</tspan> every permission and tool payload</text>
      <text x="644" y="442"><tspan fill="#d2a8ff">●</tspan> subagents, timeline and replay</text>
    </g>
  </g>
</svg>
